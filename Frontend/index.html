<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NailSoft</title>
    <meta name="description" content="NailSoft: agenda de citas, ventas e inventario para tu spa de uñas." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)" />
    <!-- Aplica el tema guardado antes de pintar, para evitar un destello claro en modo oscuro -->
    <script>
      try {
        var tema = localStorage.getItem("theme")
        if (tema === "dark" || (!tema && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
