name: mobile
description: "NailSoft para el equipo del spa: agenda, ventas, catálogo y equipo."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  # Elegir o tomar la foto de un servicio
  image_picker: ^1.1.2
  # La versión la fija flutter_localizations
  intl: any
  shared_preferences: ^2.3.2
  # Guarda la sesión cifrada (Keystore en Android, Keychain en iOS)
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - images/

flutter_icons:
  android: true
  ios: true
  image_path: "images/icono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#9E3F5F"
  adaptive_icon_foreground: "images/icono_frente.png"
  remove_alpha_ios: true
